# Site settings
# Replace the placeholder values in this file before publishing.
locale                   : "en-US"
title                    : "Marina Kotsa"
title_separator          : "|"
name                     : &name "Marina Kotsa"
description              : &description "PhD student in Economics, University College London"
url                      : "https://marina-kotsa.github.io"
baseurl                  : ""
repository               : "marina-kotsa/marina-kotsa.github.io"
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
comments:
  provider               :
atom_feed:
  path                   :

# Search-engine verification
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social sharing
twitter:
  username               : KotsaMarina
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
social:
  type                   : Person
  name                   : "Marina Kotsa"
  alternate_name         :
  links:
    - "https://www.linkedin.com/in/marina-kotsa"
    - "https://x.com/KotsaMarina"

# Analytics is disabled by default. Add your own provider and tracking ID if desired.
analytics:
  provider               : false
  google:
    tracking_id          :
    anonymize_ip         : true
google_analytics         :

# Site author
author:
  name             : "Marina Kotsa"
  avatar           : "profile.jpg"
  bio              : "PhD student in Economics, University College London"
  location         :
  employer         :
  email            : "marina.kotsa.21@ucl.ac.uk"
  uri              :
  googlescholar    :
  github           :
  twitter          : "KotsaMarina"
  linkedin         : "marina-kotsa"
  orcid            :

# Reading files
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - LICENSE
  - README.md
  - preview.html
  - research-preview.html
  - assets/css/preview.css
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
incremental: false

# Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Page defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins supported by GitHub Pages
plugins:
  - jekyll-sitemap
  - jemoji
whitelist:
  - jekyll-sitemap
  - jemoji

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
